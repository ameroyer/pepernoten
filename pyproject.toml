[project]
name = "pepernoten"
version = "0.1.0"
description = "arXiv → Obsidian notes pipeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "questionary>=2.0",
    "prompt-toolkit>=3.0",
    "openai>=1.0",
    "arxiv>=2.0",
    "requests>=2.31",
    "PyMuPDF>=1.23",
    "beautifulsoup4>=4.12",
    "scholarinboxcli",
    "fire>=0.5",
    "pyyaml>=6.0",
]

[project.scripts]
pepernoten = "pepernoten_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["pepernoten_cli.py", "src/**/*.py"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line too long — long prompt strings are intentional
    "E701",   # multiple statements on one line — compact key-binding handlers and dispatch
    "E741",   # ambiguous variable names (O, DIM used as Rich style constants in the CLI)
]

[tool.ruff.lint.per-file-ignores]
# scripts/ and the REPL must do sys.path.insert() before imports — E402/I001 are expected
"scripts/*.py"      = ["E402", "I001"]
"pepernoten_cli.py" = ["E402", "I001"]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
# scripts/ and the REPL import src modules via sys.path.insert at runtime
extraPaths = ["src", "scripts"]
include = ["src", "scripts", "pepernoten_cli.py"]
exclude = [".venv", "__pycache__"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.15.20",
    "pytest>=8.0",
]
